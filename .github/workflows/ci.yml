name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Ruff
        run: pipx run ruff==0.17.1 check .
      - name: Install hash-locked tool dependencies
        run: |
          for lock in tools/*/requirements.lock; do
            [ -e "$lock" ] || continue
            dir=$(dirname "$lock")
            python -m venv "$dir/.venv"
            "$dir/.venv/bin/pip" install --quiet --require-hashes -r "$lock"
          done
      - run: make lint-ci
      - run: make test
