target-version = "py311"

[lint]
select = ["E4", "E7", "E9", "F", "B"]

[lint.per-file-ignores]
# Tests favour compact one-line assertions and import the tool after path setup.
"**/test_*.py" = ["E402", "E701", "B023"]
# Network helpers are spliced in after the tool's own definitions.
"**/main.py" = ["E402"]
